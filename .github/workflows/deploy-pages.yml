name: Build and deploy PDSA preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Select Actions as the Pages publisher
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateInformationAboutPagesSite({
              owner: context.repo.owner,
              repo: context.repo.repo,
              build_type: 'workflow',
            })
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Run tests
        run: npm test
      - name: Build preview
        run: npm run build
        env:
          # Public client configuration only. Never add database or provider secrets here.
          VITE_NEON_AUTH_URL: ${{ vars.VITE_NEON_AUTH_URL || 'https://ep-quiet-firefly-b519pgcz.neonauth.c-7.us-east-2.aws.neon.tech/neondb/auth' }}
          # Temporary family-child dev API; UI warns to use fictional test data only.
          VITE_FAMILY_API_URL: ${{ vars.VITE_FAMILY_API_URL || 'https://br-morning-frog-b5bgnfoq-familyapi.compute.c-7.us-east-2.aws.neon.tech' }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
